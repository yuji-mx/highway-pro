# パス・ポート・プロキシ・ユーザー名
paths:
  data_dir: data
  raw_dir: data/raw
  interim_dir: data/interim
  processed_db: data/processed/roadmri.duckdb
  tiles_dir: data/tiles
  cache_dir: data/cache
  exports_dir: data/exports
  logs_dir: data/logs
  boundaries_dir: data/raw/boundaries
server:
  host: 127.0.0.1
  port: 8765
http:
  user_agent_suffix: "(+internal research use)"
  ca_bundle: null          # 社内 CA 証明書のパス（REQUESTS_CA_BUNDLE でも可）
  timeout_s: 180
  max_retries: 4
  backoff_base_s: 2.0
  retry_after_cap_s: 120   # 429/503 の Retry-After を尊重する上限
  rate_limits:             # host: {min_interval_s, max_concurrency, per_second, timeout_s, max_retries}
    overpass-api.de: {min_interval_s: 10.0, max_concurrency: 1}
    cyberjapandata.gsi.go.jp: {per_second: 20, max_concurrency: 4}
    # 3DEP ImageServer は混雑時に 504 を返す。1 要求を短く打ち切って再試行し、それでも失敗したタイルは
    # 下位の DEM（Copernicus）で補完して build を止めない（次回の build で再取得）。
    elevation.nationalmap.gov: {per_second: 5, max_concurrency: 2, timeout_s: 120, max_retries: 3}
    api.openstreetmap.org: {min_interval_s: 3.0, max_concurrency: 1}
    basemap.nationalmap.gov: {per_second: 5, max_concurrency: 2, timeout_s: 30, max_retries: 2}
    default: {max_concurrency: 4}
user:
  name: null               # null の場合は OS のユーザー名
osm:
  default_source: pbf
  buffer_km: 10
  overpass_url: https://overpass-api.de/api/interpreter
  overpass_timeout_s: 180
  geofabrik_base: https://download.geofabrik.de
  general_road_highways: [primary, secondary, tertiary, primary_link, secondary_link, tertiary_link, trunk, trunk_link]
  display_road_highways: [unclassified, residential]
map:                       # 地図表示（Web UI）。広域データでの描画負荷を抑える設定
  label_min_zoom: 11       # IC・SA/PA の名称を表示する最小ズーム
  jct_label_min_zoom: 9    # JCT の名称を表示する最小ズーム
  label_max_count: 300     # 同時に表示する名称の上限（表示範囲内のものだけ作る）
  label_update_delay_ms: 150   # 地図の移動が止まってから名称を更新するまでの待ち時間
  label_max_chars: 16      # これより長い名称は、地図では末尾の括弧書き（行先など）を省く（正式名称はホバー・情報パネル）
  label_gap_px: 3          # 名称どうし・施設の記号との間隔。重なる名称は出さない（記号は残る）
  label_mark_px: 5         # 施設の記号の半径（名称を記号の上に重ねない）
  overlay_lod: 16          # 範囲統計比較の地図で重ね描きする本線のまとめ数（tiles.layers.mainline.lod にある値）
  tooltip:                 # 地図のホバー表示（施設：名称・種別・形状、ランプ：ID・区分・長さ）
    show_delay_ms: 500     # 対象の上でマウスを止めてから表示するまで
    hide_delay_ms: 200     # 対象から離れてから消すまで（対象の上にいる間は表示を保つ）
    offset_px: 14          # カーソルからの距離（道路に重ならないように。画面端では自動で向きを変える）
    hit_px: 6              # ランプ（線）を拾う範囲
    facility_hit_px: 9     # 施設（点）を拾う範囲。この範囲では施設をランプより優先する
  glow_min_zoom: 10        # 発光（線の重ね描き）を行う最小ズーム。これより広域では 1 本の線だけ描く
  tiles:                   # 道路はベクタタイル（/api/tiles/{layer}/{z}/{x}/{y}.pbf）で表示範囲だけ配信する
    max_zoom: 14           # タイルを作る最大ズーム（これより拡大すると 14 のタイルを拡大して描く）
    extent: 4096           # タイル内の座標の分解能
    buffer: 64             # タイルの外側に含める幅（境界で線が途切れないように）
    simplify: 8            # 線の簡略化の許容差（タイル座標。extent 4096 で 256 px のとき 16 が 1 px）
    cache_tiles: 4000      # サーバーのメモリに保持するタイル数
    # 各レイヤー：min_zoom 未満では取得しない。lod: [[最大ズーム, まとめ数], ...]（連続する要素をまとめて減らす。
    # 各ズームでまとめた線が数ピクセルになる程度）。props: タイルに入れる属性（地図の色分け・クリックで使うものだけ）
    layers:
      mainline:                # 元は 100 m ごと
        min_zoom: 0
        lod: [[5, 256], [6, 128], [7, 64], [8, 32], [9, 16], [10, 8], [11, 4]]
        props: [direction, grade, z, curvature, maxspeed, lanes, low_conf]
      ramps:                   # 元は約 20 m ごと（ランプ 1 本は数十要素）
        min_zoom: 8
        lod: [[9, 64], [10, 16], [11, 8], [12, 4]]
        props: [ramp_id, flow, grade, z, curvature, quality, lanes, maxspeed, shape_class, length_m, low_conf]
      general: {min_zoom: 10, props: []}
      structures: {min_zoom: 11, props: [kind]}
    round: {grade: 1, z: 0, curvature: 6, length_m: 0}   # タイルの数値の小数桁（色分けに十分な精度。値の種類が減りタイルが小さくなる）
list:                      # 一覧画面（Web UI）
  page_size: 100           # 1 ページの件数（サーバー側でページ分割・並べ替え・検索する）
  search_delay_ms: 300     # 検索語の入力が止まってから検索するまでの待ち時間
imagery:                   # 地図の背景の航空写真（加速車線の確認用。ADR-0017）。表示した範囲のタイルだけを取得し、
  # data/cache/imagery に保存する。オフラインでは保存済みのタイルだけを表示する
  sources:
    gsi_seamless:
      name: 地理院 シームレス空中写真
      url: https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg
      max_zoom: 18             # これより拡大すると 18 のタイルを拡大して表示
      bounds: [122.9, 20.4, 154.0, 45.6]   # この範囲だけ要求する（西, 南, 東, 北）
      attribution: 出典：国土地理院（シームレス空中写真）
    usgs_imagery:
      name: USGS The National Map 航空写真
      url: https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/{z}/{y}/{x}
      max_zoom: 16
      bounds: [-179.2, 18.9, -66.9, 71.4]
      attribution: "USGS The National Map: Orthoimagery"
  browser_cache_days: 30   # ブラウザにタイルを保持させる日数
areas:                     # 地域・路線選択の地域（日本・北米）。範囲の確認と、カスタム範囲の DEM・国の既定に使う
  JP: {label: 日本, countries: [JP], bounds: [122.9, 20.4, 154.0, 45.6], dem: jp, country: JP, example_bbox: "139.72,36.515,139.90,36.655"}
  NA: {label: 北米, countries: [US, CA], bounds: [-170.0, 14.0, -50.0, 72.0], dem: us, country: US, example_bbox: "-83.77,42.215,-83.645,42.245"}

