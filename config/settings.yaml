# パス・ポート・プロキシ・ユーザー名
paths:
  data_dir: data
  raw_dir: data/raw
  interim_dir: data/interim
  processed_db: data/processed/roadmri.duckdb
  tiles_dir: data/tiles
  cache_dir: data/cache
  exports_dir: data/exports
  logs_dir: data/logs
  boundaries_dir: data/raw/boundaries
server:
  host: 127.0.0.1
  port: 8765
http:
  user_agent_suffix: "(+internal research use)"
  ca_bundle: null          # 社内 CA 証明書のパス（REQUESTS_CA_BUNDLE でも可）
  timeout_s: 180
  max_retries: 4
  backoff_base_s: 2.0
  retry_after_cap_s: 120   # 429/503 の Retry-After を尊重する上限
  rate_limits:             # host: {min_interval_s, max_concurrency, per_second, timeout_s, max_retries}
    overpass-api.de: {min_interval_s: 10.0, max_concurrency: 1}
    cyberjapandata.gsi.go.jp: {per_second: 20, max_concurrency: 4}
    # 3DEP ImageServer は混雑時に 504 を返す。1 要求を短く打ち切って再試行し、それでも失敗したタイルは
    # 下位の DEM（Copernicus）で補完して build を止めない（次回の build で再取得）。
    elevation.nationalmap.gov: {per_second: 5, max_concurrency: 2, timeout_s: 120, max_retries: 3}
    api.openstreetmap.org: {min_interval_s: 3.0, max_concurrency: 1}
    default: {max_concurrency: 4}
user:
  name: null               # null の場合は OS のユーザー名
osm:
  default_source: pbf
  buffer_km: 10
  overpass_url: https://overpass-api.de/api/interpreter
  overpass_timeout_s: 180
  geofabrik_base: https://download.geofabrik.de
  general_road_highways: [primary, secondary, tertiary, primary_link, secondary_link, tertiary_link, trunk, trunk_link]
  display_road_highways: [unclassified, residential]
map:                       # 地図表示（Web UI）。広域データでの描画負荷を抑える設定
  label_min_zoom: 11       # IC・SA/PA の名称を表示する最小ズーム
  jct_label_min_zoom: 9    # JCT の名称を表示する最小ズーム
  label_max_count: 300     # 同時に表示する名称の上限（表示範囲内のものだけ作る）
  label_update_delay_ms: 150   # 地図の移動が止まってから名称を更新するまでの待ち時間
  glow_min_zoom: 10        # 発光（線の重ね描き）を行う最小ズーム。これより広域では 1 本の線だけ描く
  general_min_zoom: 10     # 一般道を取得・表示する最小ズーム
list:                      # 一覧画面（Web UI）
  page_size: 100           # 1 ページの件数（サーバー側でページ分割・並べ替え・検索する）
  search_delay_ms: 300     # 検索語の入力が止まってから検索するまでの待ち時間

