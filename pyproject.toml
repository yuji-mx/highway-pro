[project]
name = "roadmri"
version = "0.1.0"
description = "ROAD MRI: 高速道路ネットワーク解析・可視化システム"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "pyogrio>=0.9",
  "networkx>=3.2",
  "duckdb>=1.1",
  "pyarrow>=16",
  "osmium>=3.7",
  "httpx>=0.27",
  "pillow>=10",
  "rasterio>=1.3",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6",
  "typer>=0.12",
  "matplotlib>=3.8",
  "openpyxl>=3.1",
  "jinja2>=3.1",
  "python-ulid>=2.2",
]

[project.optional-dependencies]
pdf = ["playwright>=1.40"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "pytest-benchmark>=4",
  "pytest-socket>=0.7",
  "syrupy>=4",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.scripts]
roadmri = "roadmri.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roadmri"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: requires network access (deselected by default)", "perf: performance benchmarks"]
addopts = "-m 'not network' -p no:cacheprovider"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src/roadmri"]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["roadmri"]
omit = ["src/roadmri/ingest/drive_log.py"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"src/roadmri/export/images.py" = ["E402"]
